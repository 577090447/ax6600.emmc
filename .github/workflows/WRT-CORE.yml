# 云编译公用核心
# 修订记录：
#   1) 把构建环境初始化脚本本地化（不再 curl 远程裸执行）
#   2) feeds install 拆到第三方包就位之后执行，修复第三方包全部不生效
#   3) 所有第三方包改为精确拷贝子目录，避免 Makefile 深于 2 级被漏扫
#   4) 新增 Diagnose 自检步骤，快速定位包索引/配置问题
#   5) 无线防覆盖步骤前移，修复原时序无效问题
#   6) 缓存清理改用 gh cache list --format json，避免 cut -f1 解析脆断
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_TMEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev libncurses-dev libncurses6 jq
          # 构建环境初始化脚本本地化：优先使用仓库内副本，缺失时才回退到官方远程
          if [ -x "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh" ]; then
            sudo bash "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh"
          else
            sudo bash -c 'bash <(curl -fsSL --retry 3 https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          fi
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      # ===== 将仓库根的 files/ 注入到 OpenWrt 源码树（overlay）=====
      - name: Inject custom files
        run: |
          if [ -d "${GITHUB_WORKSPACE}/files" ] && [ -n "$(ls -A ${GITHUB_WORKSPACE}/files)" ]; then
            echo "Injecting custom files into OpenWrt source..."
            mkdir -p "${GITHUB_WORKSPACE}/wrt/files"
            cp -rf "${GITHUB_WORKSPACE}/files/." "${GITHUB_WORKSPACE}/wrt/files/"
            echo "Custom files injected:"
            ls -R "${GITHUB_WORKSPACE}/wrt/files"
          else
            echo "No custom files found or files/ is empty, skipping."
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Update Feeds (only update, do not install yet)
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          # 注意：install 延后到第三方包就位之后，否则新增包不会被建索引

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            # 使用 --format json 解析，规避 cut -f1 在 CLI 版本变化时的脆断
            gh cache list --key "$WRT_CONFIG-$WRT_INFO" --format json | jq -r '.[].id' | while read -r CACHE_ID; do
              [ -n "$CACHE_ID" ] && gh cache delete "$CACHE_ID"
            done

            echo "caches cleanup done!"
          fi

      # ===== 第三方包统一用“精确拷贝子目录”，保证 Makefile 处于 package 下 2 级以内 =====
      - name: Custom Packages
        run: |
          set -e
          cd ./wrt/package/

          # 1. 通用包脚本（Packages.sh / Handles.sh）
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

          # 2. athena-led：核心包 + luci 界面包
          echo "=== Installing athena-led ==="
          rm -rf athena-led luci-app-athena-led
          git clone --depth=1 --single-branch --branch main \
            https://github.com/577090447/JDC-AX6600-Athena-LED-Controller.git /tmp/led-tmp
          cp -rf /tmp/led-tmp/athena-led ./athena-led/
          cp -rf /tmp/led-tmp/luci-app-athena-led ./luci-app-athena-led/
          rm -rf /tmp/led-tmp

          # 3. 易有云：服务包 + luci 界面包（仓库结构是子目录，必须精确拷贝）
          echo "=== Installing linkease ==="
          rm -rf linkease luci-app-linkease
          git clone --depth=1 --single-branch --branch master \
            https://github.com/linkease/nas-packages.git /tmp/nas-tmp
          cp -rf /tmp/nas-tmp/network/services/linkease ./linkease/
          rm -rf /tmp/nas-tmp
          git clone --depth=1 --single-branch --branch main \
            https://github.com/linkease/nas-packages-luci.git /tmp/nasluci-tmp
          cp -rf /tmp/nasluci-tmp/luci/luci-app-linkease ./luci-app-linkease/
          rm -rf /tmp/nasluci-tmp

          echo "=== installed packages ==="
          for p in athena-led luci-app-athena-led linkease luci-app-linkease; do
            if [ -f "$p/Makefile" ]; then
              echo "OK   $p/Makefile"
            else
              echo "MISS $p/Makefile" >&2
            fi
          done

      # ===== 第三方包就位后再建索引，这是修复“第三方包全部拉取不到”的关键 =====
      - name: Install Feeds (after custom packages landed)
        run: |
          cd ./wrt/
          ./scripts/feeds install -a

      # ===== 自检：一眼看出包到底进了哪一层 =====
      - name: Diagnose Packages
        run: |
          cd ./wrt/
          echo "=== feeds 索引行数（为 0 说明 update 网络失败） ==="
          for f in feeds/*.index; do [ -f "$f" ] && echo "$f: $(wc -l < "$f") lines"; done
          echo "=== 关键第三方包是否在索引中 ==="
          grep -h "Package:" feeds/*.index 2>/dev/null | grep -iE "openclash|passwall|aurora|vantage|linkease|ddns-go|diskman|athena-led|store" || echo "NOT FOUND IN INDEX"
          echo "=== package/ 下实际存在的第三方目录 ==="
          ls package/ | grep -iE "openclash|passwall|aurora|vantage|linkease|ddns-go|diskman|athena-led|store" || echo "NONE IN package/"
          echo "=== .config 中已选中的第三方包 ==="
          grep -oE "CONFIG_PACKAGE_(luci-(app|theme)-[a-z0-9-]+|linkease|athena-led)=y" .config || echo "NONE SELECTED"

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          # 手动包调整：追加或覆盖对应 CONFIG_PACKAGE 开关
          if [ -n "$WRT_PACKAGE" ]; then
            printf '%s\n' "$WRT_PACKAGE" >> .config
          fi

          # 无线防覆盖必须在本步骤之前/之中生效；Settings.sh 跑完后不再回写无线
          if [ -f "$GITHUB_WORKSPACE/Scripts/Settings.sh" ]; then
            sed -i '/set-wireless.sh/d' "$GITHUB_WORKSPACE/Scripts/Settings.sh"
            echo "Disabled automatic wireless SSID/KEY overwrite."
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename "$FILE" | cut -d '.' -f 2-)
              NAME=$(basename "$FILE" | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f "$FILE" ./upload/"$NEW_FILE"
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
